# 2-vCPU Linux guest on the QEMU aarch64 RT board.
#
# Derived from `linux-smp1.toml`. The guest sees 2 vCPUs pinned to physical
# CPUs 0 and 1 (`phys_cpu_ids`); physical CPU 3 is reserved for the realtime
# domain by the board config (qemu-aarch64-rt.toml + RT_CPUMASK=3), so the
# guest's vCPUs never run on the RT core. See
# docs/design/axtask-rt-fifo-and-pi.md and the task-1 runbook for the binding
# rationale.
#
# The Linux kernel image is a runtime asset loaded from the Axvisor filesystem;
# place a 2-vCPU-capable Image at `kernel_path` before boot.

[base]
id = 1
name = "linux-qemu-smp2"
guest_type = "passthrough"
cpu_num = 2
# vCPU0 -> pCPU0, vCPU1 -> pCPU1. pCPU3 is the reserved RT core.
phys_cpu_ids = [0, 1]

[kernel]
entry_point = 0x8020_0000
image_location = "fs"
kernel_path = "/guest/linux/linux-qemu-smp2"
kernel_load_addr = 0x8020_0000
dtb_load_addr = 0x8000_0000

# System RAM 1G, identity-mapped for the guest.
memory_regions = [
  [0x8000_0000, 0x1000_0000, 0x7, 1],
]

[devices]
passthrough = []
disabled = []
