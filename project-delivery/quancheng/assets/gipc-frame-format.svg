<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">GIPC 帧格式与校验边界</title><desc id="desc">展示32字节固定头各字段偏移、负载上限、网络序和CRC32覆盖范围。</desc>
  <defs><style>.bg{fill:#f8fafc}.title{font:700 28px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 14px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 14px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.b{font:400 12px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}.m{font:400 11px "DejaVu Sans Mono",monospace;fill:#334155}.id{fill:#dcfce7;stroke:#16a34a}.frame{fill:#dbeafe;stroke:#2563eb}.corr{fill:#ffedd5;stroke:#ea580c}.integ{fill:#f3e8ff;stroke:#7c3aed}.payload{fill:#fef9c3;stroke:#ca8a04}.box{stroke-width:1.5}.line{stroke:#64748b;stroke-width:1.3}.bracket{fill:none;stroke:#7c3aed;stroke-width:2}</style></defs>
  <rect class="bg" width="1440" height="620"/><text class="title" x="720" y="42" text-anchor="middle">GIPC v1 二进制帧格式</text><text class="sub" x="720" y="68" text-anchor="middle">固定头 32 B · payload 0..1200 B · 多字节字段均为网络序（大端）</text>
  <text class="h" x="80" y="115">字节偏移</text>
  <g transform="translate(80 135)">
    <rect class="id box" x="0" y="0" width="160" height="88"/><text class="h" x="80" y="28" text-anchor="middle">magic</text><text class="m" x="80" y="49" text-anchor="middle">0..3 · u32</text><text class="b" x="80" y="70" text-anchor="middle">0x47495043</text>
    <rect class="id box" x="160" y="0" width="70" height="88"/><text class="h" x="195" y="28" text-anchor="middle">ver</text><text class="m" x="195" y="49" text-anchor="middle">4 · u8</text><text class="b" x="195" y="70" text-anchor="middle">1</text>
    <rect class="id box" x="230" y="0" width="90" height="88"/><text class="h" x="275" y="28" text-anchor="middle">type</text><text class="m" x="275" y="49" text-anchor="middle">5 · u8</text><text class="b" x="275" y="70" text-anchor="middle">1..6</text>
    <rect class="frame box" x="320" y="0" width="100" height="88"/><text class="h" x="370" y="28" text-anchor="middle">flags</text><text class="m" x="370" y="49" text-anchor="middle">6..7</text><text class="b" x="370" y="70" text-anchor="middle">u16</text>
    <rect class="frame box" x="420" y="0" width="115" height="88"/><text class="h" x="477" y="28" text-anchor="middle">header_len</text><text class="m" x="477" y="49" text-anchor="middle">8..9</text><text class="b" x="477" y="70" text-anchor="middle">32</text>
    <rect class="frame box" x="535" y="0" width="120" height="88"/><text class="h" x="595" y="28" text-anchor="middle">payload_len</text><text class="m" x="595" y="49" text-anchor="middle">10..11</text><text class="b" x="595" y="70" text-anchor="middle">≤ 1200</text>
    <rect class="corr box" x="655" y="0" width="145" height="88"/><text class="h" x="727" y="28" text-anchor="middle">sequence</text><text class="m" x="727" y="49" text-anchor="middle">12..15 · u32</text><text class="b" x="727" y="70" text-anchor="middle">请求关联</text>
    <rect class="corr box" x="800" y="0" width="205" height="88"/><text class="h" x="902" y="28" text-anchor="middle">timestamp_ns</text><text class="m" x="902" y="49" text-anchor="middle">16..23 · u64</text><text class="b" x="902" y="70" text-anchor="middle">单调时钟</text>
    <rect class="corr box" x="1005" y="0" width="105" height="88"/><text class="h" x="1057" y="28" text-anchor="middle">error</text><text class="m" x="1057" y="49" text-anchor="middle">24..25</text><text class="b" x="1057" y="70" text-anchor="middle">u16</text>
    <rect class="integ box" x="1110" y="0" width="135" height="88"/><text class="h" x="1177" y="28" text-anchor="middle">CRC32</text><text class="m" x="1177" y="49" text-anchor="middle">26..29</text><text class="b" x="1177" y="70" text-anchor="middle">IEEE reflected</text>
    <rect class="integ box" x="1245" y="0" width="70" height="88"/><text class="h" x="1280" y="28" text-anchor="middle">保留</text><text class="m" x="1280" y="49" text-anchor="middle">30..31</text><text class="b" x="1280" y="70" text-anchor="middle">0</text>
  </g>
  <rect class="payload box" x="80" y="270" width="1315" height="72"/><text class="h" x="737" y="298" text-anchor="middle">payload · 0..1200 bytes</text><text class="b" x="737" y="322" text-anchor="middle">当前 CONTROL 为固定 8 B；STATUS 原样返回 payload；ERROR payload 为空并使用 error_code</text>
  <path class="bracket" d="M80 370 L80 390 L1395 390 L1395 370"/><text class="h" x="737" y="420" text-anchor="middle">CRC 覆盖：header（checksum 字段先清零）+ payload；保留字节也参与计算</text>
  <g transform="translate(80 470)"><rect class="id box" width="250" height="75"/><text class="h" x="125" y="27" text-anchor="middle">身份识别 0..5</text><text class="b" x="125" y="50" text-anchor="middle">magic / version / type</text><rect class="frame box" x="280" width="250" height="75"/><text class="h" x="405" y="27" text-anchor="middle">分帧边界 6..11</text><text class="b" x="405" y="50" text-anchor="middle">flags / header_len / payload_len</text><rect class="corr box" x="560" width="370" height="75"/><text class="h" x="745" y="27" text-anchor="middle">请求关联 12..25</text><text class="b" x="745" y="50" text-anchor="middle">sequence / timestamp / error_code</text><rect class="integ box" x="960" width="355" height="75"/><text class="h" x="1137" y="27" text-anchor="middle">完整性与演进 26..31</text><text class="b" x="1137" y="50" text-anchor="middle">checksum / reserved</text></g>
</svg>
