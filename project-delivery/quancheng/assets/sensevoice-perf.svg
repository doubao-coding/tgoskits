<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">SenseVoice 推理与模型加载性能对比</title>
  <desc id="desc">以两组水平条形图对比 OrangePi 5 Plus 上 axvisor+starry guest 优化前后的单条推理耗时与模型加载耗时，并以原生 Linux 为参照。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.subtitle{font:400 15px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}.panel{font:700 20px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.name{font:700 15px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 12px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#64748b}.val{font:700 16px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.axis{font:400 12px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#64748b}.note{font:400 13px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}.noteb{font:700 13px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.3;rx:12}.grid{stroke:#e2e8f0;stroke-width:1}.baseline{stroke:#94a3b8;stroke-width:1.5}.native{fill:#2563eb}.noop{fill:#ea580c}.opt{fill:#0d9488}.callout{fill:#fefce8;stroke:#ca8a04;stroke-width:1.4;rx:8}
    </style>
  </defs>
  <rect class="bg" width="1440" height="780"/>
  <text class="title" x="720" y="44" text-anchor="middle">SenseVoice 推理与模型加载性能对比</text>
  <text class="subtitle" x="720" y="70" text-anchor="middle">OrangePi 5 Plus · axvisor + starry guest 优化前后与原生 Linux 对照（板级日志 Error 档实测，zh.wav）</text>

  <!-- ================= panel 1: inference ================= -->
  <rect class="card" x="60" y="110" width="640" height="520"/>
  <text class="panel" x="90" y="152">单条推理耗时（秒）</text>
  <text class="sub" x="90" y="174">同一 zh.wav，越小越好</text>

  <!-- gridlines: x from 260, plot width 380, scale 0..3.2s -->
  <g>
    <line class="grid" x1="260" y1="200" x2="260" y2="560"/>
    <line class="grid" x1="355" y1="200" x2="355" y2="560"/>
    <line class="grid" x1="450" y1="200" x2="450" y2="560"/>
    <line class="grid" x1="545" y1="200" x2="545" y2="560"/>
    <line class="grid" x1="640" y1="200" x2="640" y2="560"/>
    <line class="baseline" x1="260" y1="560" x2="640" y2="560"/>
    <text class="axis" x="260" y="580" text-anchor="middle">0</text>
    <text class="axis" x="355" y="580" text-anchor="middle">0.8</text>
    <text class="axis" x="450" y="580" text-anchor="middle">1.6</text>
    <text class="axis" x="545" y="580" text-anchor="middle">2.4</text>
    <text class="axis" x="640" y="580" text-anchor="middle">3.2</text>
  </g>

  <!-- bars: h=52, scale 118.75 px/s -->
  <!-- starry-no-op 2.96s -> 351.5px -->
  <text class="name" x="245" y="252" text-anchor="end">starry（优化前）</text>
  <path class="noop" d="M 260 222 h 347.5 a 4 4 0 0 1 4 4 v 44 a 4 4 0 0 1 -4 4 h -347.5 z"/>
  <text class="val" x="618" y="252" text-anchor="end">2.96 s</text>

  <!-- starry-opt 1.4645s -> 173.9px -->
  <text class="name" x="245" y="352" text-anchor="end">starry（优化后·动态调频）</text>
  <path class="opt" d="M 260 322 h 169.9 a 4 4 0 0 1 4 4 v 44 a 4 4 0 0 1 -4 4 h -169.9 z"/>
  <text class="val" x="446" y="352">1.46 s</text>

  <!-- native 1.0378s -> 123.2px -->
  <text class="name" x="245" y="452" text-anchor="end">原生 Linux</text>
  <path class="native" d="M 260 422 h 119.2 a 4 4 0 0 1 4 4 v 44 a 4 4 0 0 1 -4 4 h -119.2 z"/>
  <text class="val" x="395" y="452">1.04 s</text>

  <!-- convergence callout -->
  <rect class="callout" x="420" y="480" width="250" height="52"/>
  <text class="note" x="545" y="501" text-anchor="middle">优化后为原生的 1.41×</text>
  <text class="note" x="545" y="520" text-anchor="middle">NPU 提交路径已与原生平价</text>

  <!-- ================= panel 2: model load ================= -->
  <rect class="card" x="740" y="110" width="640" height="520"/>
  <text class="panel" x="770" y="152">模型加载耗时（秒）</text>
  <text class="sub" x="770" y="174">490 MB 模型读入 + 运行时初始化，越小越好</text>

  <!-- gridlines: x from 940, plot width 380, scale 0..44s -->
  <g>
    <line class="grid" x1="940" y1="200" x2="940" y2="560"/>
    <line class="grid" x1="1035" y1="200" x2="1035" y2="560"/>
    <line class="grid" x1="1130" y1="200" x2="1130" y2="560"/>
    <line class="grid" x1="1225" y1="200" x2="1225" y2="560"/>
    <line class="grid" x1="1320" y1="200" x2="1320" y2="560"/>
    <line class="baseline" x1="940" y1="560" x2="1320" y2="560"/>
    <text class="axis" x="940" y="580" text-anchor="middle">0</text>
    <text class="axis" x="1035" y="580" text-anchor="middle">11</text>
    <text class="axis" x="1130" y="580" text-anchor="middle">22</text>
    <text class="axis" x="1225" y="580" text-anchor="middle">33</text>
    <text class="axis" x="1320" y="580" text-anchor="middle">44</text>
  </g>

  <!-- bars: h=52, scale 8.636 px/s -->
  <!-- starry-no-op 41.23s -> 356.1px -->
  <text class="name" x="925" y="252" text-anchor="end">starry（优化前）</text>
  <path class="noop" d="M 940 222 h 352.1 a 4 4 0 0 1 4 4 v 44 a 4 4 0 0 1 -4 4 h -352.1 z"/>
  <text class="val" x="1305" y="252" text-anchor="end">41.23 s</text>

  <!-- starry-opt 30.62s -> 264.4px -->
  <text class="name" x="925" y="352" text-anchor="end">starry（优化后·动态调频）</text>
  <path class="opt" d="M 940 322 h 260.4 a 4 4 0 0 1 4 4 v 44 a 4 4 0 0 1 -4 4 h -260.4 z"/>
  <text class="val" x="1214" y="352">30.62 s</text>
  <text class="noteb" x="1214" y="372">＝ SD 冷读 29.82 s ＋ 初始化 0.50 s</text>

  <!-- native 0.65s -> 5.6px -->
  <text class="name" x="925" y="452" text-anchor="end">原生 Linux</text>
  <path class="native" d="M 940 422 h 1.6 a 4 4 0 0 1 4 4 v 44 a 4 4 0 0 1 -4 4 h -1.6 z"/>
  <text class="val" x="956" y="452">0.65 s（页缓存热读）</text>

  <!-- bottleneck callout -->
  <rect class="callout" x="955" y="474" width="410" height="74"/>
  <text class="note" x="1160" y="495" text-anchor="middle">剩余差距为 SD HighSpeed 总线极限</text>
  <text class="note" x="1160" y="514" text-anchor="middle">冷读 16.4 MB/s ≈ 总线带宽 24.75 MB/s 的 66%</text>
  <text class="note" x="1160" y="533" text-anchor="middle">（静态 1200 MHz 组 19.2 MB/s，为极限的 78%）</text>

  <text class="sub" x="720" y="672" text-anchor="middle">starry（优化后）＝ vCPU 绑定 A76 大核 ＋ 板级日志降噪 ＋ 调频 governor 拓扑归因修复（PR #2165 / #2166）；静态 1200 MHz 组：加载 26.30 s、推理 1.72 s。原始数据见 test-plan.md §5.3</text>
  <text class="sub" x="720" y="696" text-anchor="middle">转写结果三配置一致（zh.wav，fp16 精度边缘）：「开放时早九点至下午五点」</text>
</svg>
