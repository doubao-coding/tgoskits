<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">泉城比赛混合系统总体架构图</title>
  <desc id="desc">底层 Axvisor 作为虚拟化底座，左侧为 Starry 生态智能侧客户机，右侧为隔离实时 CPU 上的 Axvisor 实时任务，上层形成 AI 联动控制闭环。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .section-title { font: 700 20px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 700 17px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 400 14px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 12px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .platform { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
      .axvisor { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .starry { fill: #ecfdf5; stroke: #0f766e; stroke-width: 2; rx: 8; }
      .rtcore { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 8; }
      .app { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 8; }
      .module { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 6; }
      .line { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .blue-line { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#blueArrow); }
      .green-line { fill: none; stroke: #0f766e; stroke-width: 2.5; marker-end: url(#greenArrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760"/>

  <text class="title" x="640" y="46" text-anchor="middle">智能化工控虚拟化混合系统总体架构</text>
  <text class="subtitle" x="640" y="76" text-anchor="middle">Axvisor 采用 AMP 隔离方案：Starry 智能侧运行在 guest 中，实时控制运行在预留 CPU 上</text>

  <rect class="app" x="170" y="105" width="940" height="86"/>
  <text class="section-title" x="640" y="137" text-anchor="middle">任务三：AI 联动控制应用</text>
  <text class="body" x="640" y="164" text-anchor="middle">输入感知 / 模型推理 / 控制动作生成 / 状态回传 / 端到端时延统计</text>

  <rect class="starry" x="100" y="240" width="475" height="250"/>
  <text class="section-title" x="337" y="274" text-anchor="middle">左侧：Starry 生态智能侧客户机</text>
  <rect class="module" x="135" y="305" width="190" height="58"/>
  <text class="label" x="230" y="329" text-anchor="middle">AI 推理运行时</text>
  <text class="small" x="230" y="350" text-anchor="middle">模型加载、样例输入、推理输出</text>
  <rect class="module" x="350" y="305" width="190" height="58"/>
  <text class="label" x="445" y="329" text-anchor="middle">StarryOS / Linux 兼容</text>
  <text class="small" x="445" y="350" text-anchor="middle">用户态能力、脚本、网络栈</text>
  <rect class="module" x="135" y="390" width="190" height="58"/>
  <text class="label" x="230" y="414" text-anchor="middle">协议客户端</text>
  <text class="small" x="230" y="435" text-anchor="middle">控制指令封装、心跳、重试</text>
  <rect class="module" x="350" y="390" width="190" height="58"/>
  <text class="label" x="445" y="414" text-anchor="middle">日志与指标采集</text>
  <text class="small" x="445" y="435" text-anchor="middle">推理耗时、通信耗时、闭环耗时</text>

  <rect class="rtcore" x="705" y="240" width="475" height="250"/>
  <text class="section-title" x="942" y="274" text-anchor="middle">右侧：隔离实时 CPU / Axvisor RT 任务</text>
  <rect class="module" x="740" y="305" width="190" height="58"/>
  <text class="label" x="835" y="329" text-anchor="middle">预留实时 CPU</text>
  <text class="small" x="835" y="350" text-anchor="middle">独占核心、8ms 控制周期</text>
  <rect class="module" x="955" y="305" width="190" height="58"/>
  <text class="label" x="1050" y="329" text-anchor="middle">Axvisor RT 路径</text>
  <text class="small" x="1050" y="350" text-anchor="middle">不启动控制侧 guest OS</text>
  <rect class="module" x="740" y="390" width="190" height="58"/>
  <text class="label" x="835" y="414" text-anchor="middle">实时控制闭环</text>
  <text class="small" x="835" y="435" text-anchor="middle">平衡控制、状态机、降级</text>
  <rect class="module" x="955" y="390" width="190" height="58"/>
  <text class="label" x="1050" y="414" text-anchor="middle">板级外设控制</text>
  <text class="small" x="1050" y="435" text-anchor="middle">IMU、电机、串口/I2C</text>

  <rect class="card" x="560" y="310" width="160" height="105"/>
  <text class="label" x="640" y="337" text-anchor="middle">任务二</text>
  <text class="label" x="640" y="361" text-anchor="middle">控制通道底座</text>
  <text class="small" x="640" y="386" text-anchor="middle">RT mailbox 原型</text>
  <text class="small" x="640" y="405" text-anchor="middle">console / 结构化协议</text>

  <path class="blue-line" d="M 230 390 C 260 246, 420 155, 580 150"/>
  <path class="blue-line" d="M 700 150 C 860 155, 1020 246, 1050 305"/>
  <text class="small" x="640" y="218" text-anchor="middle">AI 推理结果转换为控制指令</text>

  <path class="green-line" d="M 540 420 L 560 380"/>
  <path class="green-line" d="M 720 380 L 955 380"/>
  <text class="small" x="775" y="376" text-anchor="start">控制指令进入实时侧</text>

  <path class="line" d="M 955 432 C 810 520, 470 520, 325 432"/>
  <text class="small" x="640" y="535" text-anchor="middle">状态回传：执行结果、实时侧时间戳、异常状态</text>

  <rect class="axvisor" x="100" y="560" width="1080" height="105"/>
  <text class="section-title" x="640" y="592" text-anchor="middle">任务一：Axvisor 虚拟化底座</text>
  <text class="body" x="640" y="620" text-anchor="middle">智能侧 VM 生命周期 / vCPU 调度 / 实时 CPU 预留 / 设备隔离 / 中断定时器 / 板级配置</text>
  <text class="small" x="640" y="645" text-anchor="middle">AMP 方案将 AI 负载与 8ms 实时控制闭环分离，避免控制路径受 guest 调度抖动影响</text>

  <rect class="platform" x="100" y="690" width="1080" height="42"/>
  <text class="body" x="640" y="716" text-anchor="middle">硬件与仿真平台：QEMU / 开发板 / CPU / 内存 / 网络 / 块设备 / NPU 或其他外设</text>

  <path class="dash" d="M 337 490 L 337 560"/>
  <path class="dash" d="M 942 490 L 942 560"/>
  <path class="dash" d="M 640 415 L 640 560"/>
  <path class="dash" d="M 640 665 L 640 690"/>

  <text class="small" x="337" y="545" text-anchor="middle">智能侧 VM</text>
  <text class="small" x="942" y="545" text-anchor="middle">隔离实时 CPU</text>
</svg>
