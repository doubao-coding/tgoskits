<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">GIPC 请求响应与异常恢复时序</title><desc id="desc">展示Starry客户端、TCP字节流、Axvisor交换机和ArceOS服务端之间的正常请求、协议错误和断连重试。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker><style>.bg{fill:#f8fafc}.t{font:700 28px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font:700 15px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.b{font:400 12px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}.s{font:400 11px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}.actor{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:8}.life{stroke:#94a3b8;stroke-width:1.3;stroke-dasharray:6 5}.msg{stroke:#2563eb;stroke-width:2;marker-end:url(#a)}.ret{stroke:#0f766e;stroke-width:2;marker-end:url(#a)}.err{stroke:#dc2626;stroke-width:2;marker-end:url(#e);stroke-dasharray:7 4}.box{fill:#fff7ed;stroke:#ea580c;stroke-width:1.3;rx:7}.alt{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.3;rx:7}</style></defs><rect class="bg" width="1440" height="900"/><text class="t" x="720" y="42" text-anchor="middle">GIPC 正常请求、语义错误与连接恢复时序</text>
<g><rect class="actor" x="70" y="80" width="250" height="55"/><text class="h" x="195" y="113" text-anchor="middle">Starry C 客户端</text><rect class="actor" x="405" y="80" width="250" height="55"/><text class="h" x="530" y="105" text-anchor="middle">TCP 字节流</text><text class="s" x="530" y="122" text-anchor="middle">SO_SNDTIMEO/SO_RCVTIMEO=1s</text><rect class="actor" x="740" y="80" width="250" height="55"/><text class="h" x="865" y="105" text-anchor="middle">Axvisor L2 switch</text><text class="s" x="865" y="122" text-anchor="middle">MAC anti-spoof / local forwarding</text><rect class="actor" x="1075" y="80" width="290" height="55"/><text class="h" x="1220" y="105" text-anchor="middle">ArceOS Rust 服务端</text><text class="s" x="1220" y="122" text-anchor="middle">0.0.0.0:4242 / connection session</text></g>
<line class="life" x1="195" y1="135" x2="195" y2="850"/><line class="life" x1="530" y1="135" x2="530" y2="850"/><line class="life" x1="865" y1="135" x2="865" y2="850"/><line class="life" x1="1220" y1="135" x2="1220" y2="850"/>
<text class="h" x="45" y="180">正常路径</text><line class="msg" x1="195" y1="205" x2="530" y2="205"/><text class="b" x="362" y="195" text-anchor="middle">connect 10.0.42.2:4242</text><line class="msg" x1="530" y1="235" x2="1220" y2="235"/><text class="b" x="875" y="225" text-anchor="middle">accept connection</text><line class="msg" x1="195" y1="280" x2="530" y2="280"/><text class="b" x="362" y="270" text-anchor="middle">write_full(32 B header + 8 B CONTROL)</text><line class="msg" x1="530" y1="310" x2="865" y2="310"/><line class="msg" x1="865" y1="340" x2="1220" y2="340"/><text class="b" x="1042" y="330" text-anchor="middle">VirtIO RX</text>
<rect class="alt" x="1060" y="365" width="320" height="118"/><text class="h" x="1220" y="390" text-anchor="middle">分层校验</text><text class="s" x="1220" y="413" text-anchor="middle">read_exact 32 B → decode_header</text><text class="s" x="1220" y="434" text-anchor="middle">read_exact payload_len → CRC32</text><text class="s" x="1220" y="455" text-anchor="middle">observe(sequence) → dispatch(Control)</text><text class="s" x="1220" y="476" text-anchor="middle">encode STATUS(same sequence, same payload)</text>
<line class="ret" x1="1220" y1="515" x2="865" y2="515"/><line class="ret" x1="865" y1="545" x2="530" y2="545"/><line class="ret" x1="530" y1="575" x2="195" y2="575"/><text class="b" x="362" y="565" text-anchor="middle">read 32 B + payload；验证 magic/version/seq/CRC</text><text class="s" x="195" y="605" text-anchor="middle">STATUS → success++ / RTT / payload throughput</text>
<text class="h" x="45" y="650">异常分支</text><rect class="box" x="90" y="675" width="360" height="125"/><text class="h" x="270" y="700" text-anchor="middle">连接/读写失败</text><text class="s" x="270" y="723" text-anchor="middle">close → timeouts++ → attempt++</text><text class="s" x="270" y="744" text-anchor="middle">attempt &lt; 3：新建 socket 并重发同 sequence</text><text class="s" x="270" y="765" text-anchor="middle">预算耗尽：GIPC_STARRY_TIMEOUT + 非零退出</text><text class="s" x="270" y="786" text-anchor="middle">重连后合法 STATUS 才算恢复成功</text>
<rect class="box" x="540" y="675" width="370" height="125"/><text class="h" x="725" y="700" text-anchor="middle">可关联的语义错误</text><text class="s" x="725" y="723" text-anchor="middle">InvalidPayload / InvalidSequence / UnsupportedMessage</text><text class="s" x="725" y="744" text-anchor="middle">服务端返回 ERROR(same sequence, error_code)</text><text class="s" x="725" y="765" text-anchor="middle">客户端 errors++，记录 code/seq，不伪造成功</text><text class="s" x="725" y="786" text-anchor="middle">连接可继续处理下一帧（按错误类别）</text>
<rect class="box" x="1000" y="675" width="370" height="125"/><text class="h" x="1185" y="700" text-anchor="middle">结构/完整性错误</text><text class="s" x="1185" y="723" text-anchor="middle">bad magic/version/header length/type/error code/CRC</text><text class="s" x="1185" y="744" text-anchor="middle">fail-closed：结束当前连接</text><text class="s" x="1185" y="765" text-anchor="middle">GIPC_RTOS_RECOVERABLE_ERROR</text><text class="s" x="1185" y="786" text-anchor="middle">外层 accept 循环继续接收新连接</text>
<line class="err" x1="450" y1="815" x2="195" y2="815"/><line class="err" x1="1000" y1="815" x2="1220" y2="815"/><text class="s" x="720" y="855" text-anchor="middle">边界：服务端序列窗口仅在当前 TCP 连接内；每个新连接重建 ReliableSession</text></svg>
