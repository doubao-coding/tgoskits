<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc"><title id="title">GIPC 验证与指标流水线</title><desc id="desc">从QEMU双客户机日志到成功标志验证、指标聚合和非零失败传播的流水线。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><style>.bg{fill:#f8fafc}.t{font:700 28px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font:700 15px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.b{font:400 12px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}.m{font:400 11px "DejaVu Sans Mono",monospace;fill:#334155}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:9}.run{fill:#dbeafe;stroke:#2563eb;stroke-width:1.8;rx:9}.check{fill:#ecfdf5;stroke:#0f766e;stroke-width:1.8;rx:9}.agg{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.8;rx:9}.fail{fill:#fee2e2;stroke:#dc2626;stroke-width:1.5;rx:8}.line{stroke:#2563eb;stroke-width:2.3;marker-end:url(#a)}.dash{stroke:#64748b;stroke-width:1.3;stroke-dasharray:6 4;marker-end:url(#a)}</style></defs><rect class="bg" width="1440" height="700"/><text class="t" x="720" y="42" text-anchor="middle">GIPC 端到端验证与可观测性流水线</text>
<rect class="run" x="55" y="95" width="290" height="170"/><text class="h" x="200" y="125" text-anchor="middle">1 · QEMU 双 guest 运行</text><text class="m" x="200" y="153" text-anchor="middle">run-qemu-aarch64-starry-rtos-gipc.sh</text><text class="b" x="200" y="180" text-anchor="middle">构建 ArceOS server</text><text class="b" x="200" y="201" text-anchor="middle">注入 Starry client/network-init</text><text class="b" x="200" y="222" text-anchor="middle">启动 Axvisor + 2 × VirtIO-net VM</text><text class="b" x="200" y="243" text-anchor="middle">QEMU timeout = 180 s</text>
<rect class="box" x="405" y="95" width="300" height="170"/><text class="h" x="555" y="125" text-anchor="middle">2 · 结构化日志</text><text class="m" x="555" y="153" text-anchor="middle">GIPC_STARRY_NET_READY</text><text class="m" x="555" y="176" text-anchor="middle">GIPC_RTOS_READY / LISTEN</text><text class="m" x="555" y="199" text-anchor="middle">GIPC_STARRY_STATUS seq=...</text><text class="m" x="555" y="222" text-anchor="middle">GIPC_STARRY_METRIC ...</text><text class="m" x="555" y="245" text-anchor="middle">GIPC_*_ERROR / TIMEOUT</text>
<rect class="check" x="765" y="95" width="290" height="170"/><text class="h" x="910" y="125" text-anchor="middle">3 · 单次运行门禁</text><text class="m" x="910" y="153" text-anchor="middle">verify_metrics.py</text><text class="b" x="910" y="180" text-anchor="middle">STATUS 与 METRIC 必须存在</text><text class="b" x="910" y="201" text-anchor="middle">requests == success</text><text class="b" x="910" y="222" text-anchor="middle">RTT &gt; 0 / throughput &gt; 0</text><text class="b" x="910" y="243" text-anchor="middle">不得出现 ERROR/TIMEOUT</text>
<rect class="agg" x="1115" y="95" width="270" height="170"/><text class="h" x="1250" y="125" text-anchor="middle">4 · 多样本聚合</text><text class="m" x="1250" y="153" text-anchor="middle">aggregate_metrics.py</text><text class="b" x="1250" y="180" text-anchor="middle">success_rate / app_errors</text><text class="b" x="1250" y="201" text-anchor="middle">timeouts / reconnects / recoveries</text><text class="b" x="1250" y="222" text-anchor="middle">RTT P50 / P95</text><text class="b" x="1250" y="243" text-anchor="middle">throughput_avg_bps</text>
<line class="line" x1="345" y1="180" x2="405" y2="180"/><line class="line" x1="705" y1="180" x2="765" y2="180"/><line class="line" x1="1055" y1="180" x2="1115" y2="180"/>
<text class="h" x="55" y="320">指标口径</text><g transform="translate(55 345)"><rect class="box" width="250" height="105"/><text class="h" x="125" y="28" text-anchor="middle">请求完成</text><text class="m" x="125" y="54" text-anchor="middle">success / requests</text><text class="b" x="125" y="80" text-anchor="middle">聚合器计算精确比率</text><rect class="box" x="275" width="250" height="105"/><text class="h" x="400" y="28" text-anchor="middle">延迟</text><text class="m" x="400" y="54" text-anchor="middle">t_valid_status - t_send</text><text class="b" x="400" y="80" text-anchor="middle">成功尝试 RTT；P50/P95</text><rect class="box" x="550" width="250" height="105"/><text class="h" x="675" y="28" text-anchor="middle">有效吞吐</text><text class="m" x="675" y="54" text-anchor="middle">response_payload / RTT</text><text class="b" x="675" y="80" text-anchor="middle">不含头部与请求字节</text><rect class="box" x="825" width="250" height="105"/><text class="h" x="950" y="28" text-anchor="middle">恢复</text><text class="m" x="950" y="54" text-anchor="middle">reconnects / recovery flag</text><text class="b" x="950" y="80" text-anchor="middle">重连后合法 STATUS 才成立</text><rect class="box" x="1100" width="250" height="105"/><text class="h" x="1225" y="28" text-anchor="middle">错误</text><text class="m" x="1225" y="54" text-anchor="middle">errors / timeouts</text><text class="b" x="1225" y="80" text-anchor="middle">协议错误与传输失败分栏</text></g>
<rect class="fail" x="175" y="505" width="1090" height="125"/><text class="h" x="720" y="535" text-anchor="middle">失败传播与 QEMU 正则门禁</text><text class="m" x="720" y="565" text-anchor="middle">fail_regex: (?i)panic | GIPC_RTOS_ERROR | GIPC_STARRY_TIMEOUT</text><text class="m" x="720" y="590" text-anchor="middle">success_regex: GIPC_RTOS_READY ... GIPC_STARRY_STATUS ... GIPC_STARRY_METRIC</text><text class="b" x="720" y="615" text-anchor="middle">解析器无样本、成功数不足或应用错误非零均返回非零状态；恢复后的 timeout/reconnect 可保留为可观测事件</text>
<line class="dash" x1="910" y1="265" x2="720" y2="505"/><line class="dash" x1="1250" y1="265" x2="720" y2="505"/></svg>
