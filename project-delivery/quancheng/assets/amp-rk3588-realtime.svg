<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">RK3588 Axvisor AMP realtime measurements</title>
  <desc id="desc">Measured latency and jitter data for Axvisor AMP on RK3588 board.</desc>
  <rect width="1120" height="680" fill="#f8fafc"/>
  <text x="42" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">RK3588 真机 Axvisor AMP 实测：微秒级实时路径</text>
  <text x="42" y="82" font-family="Arial, sans-serif" font-size="15" fill="#475569">数据来自 rk3588 + axvisor(amp方案)。8ms 双轮足控制周期 = 8,000,000 ns。</text>

  <text x="60" y="128" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">平均耗时</text>
  <line x1="230" y1="155" x2="230" y2="385" stroke="#cbd5e1"/>
  <line x1="230" y1="385" x2="1040" y2="385" stroke="#cbd5e1"/>
  <g stroke="#e2e8f0">
    <line x1="500" y1="155" x2="500" y2="385"/>
    <line x1="770" y1="155" x2="770" y2="385"/>
    <line x1="1040" y1="155" x2="1040" y2="385"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    <text x="230" y="410">0 ns</text>
    <text x="500" y="410">500 ns</text>
    <text x="770" y="410">1000 ns</text>
    <text x="1040" y="410">1500 ns</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#0f172a">
    <text x="60" y="184">Task Switch</text>
    <text x="60" y="234">Preemption</text>
    <text x="60" y="284">IRQ Latency</text>
    <text x="60" y="334">Sem Shuffle</text>
  </g>
  <g fill="#2563eb">
    <rect x="230" y="164" width="576" height="24" rx="6"/>
    <rect x="230" y="214" width="552" height="24" rx="6"/>
    <rect x="230" y="264" width="353" height="24" rx="6"/>
    <rect x="230" y="314" width="552" height="24" rx="6"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">
    <text x="818" y="182">1066 ns</text>
    <text x="794" y="232">1023 ns</text>
    <text x="595" y="282">654 ns</text>
    <text x="794" y="332">1022 ns</text>
  </g>

  <text x="60" y="470" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">8ms 控制周期预算占用</text>
  <rect x="60" y="500" width="1000" height="58" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="60" y="500" width="1" height="58" rx="1" fill="#14532d"/>
  <text x="84" y="535" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">Tick jitter: 4084 ns = 0.0511% of 8ms</text>
  <text x="780" y="535" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">Remaining: 99.9489%</text>

  <g font-family="Arial, sans-serif" font-size="14" fill="#475569">
    <text x="60" y="604">Min/Max evidence: Task Switch 875-1458 ns, Preemption 875-1459 ns, IRQ 292-2792 ns, Sem Shuffle 875-1167 ns.</text>
    <text x="60" y="632">Interpretation: the AMP realtime path is small compared with the 8ms wheel-biped balance period, leaving budget for EKF/LQR, IMU and motor UART.</text>
  </g>
</svg>
