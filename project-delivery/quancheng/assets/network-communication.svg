<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">StarryOS 与 ArceOS GIPC 网络链路分层图</title>
  <desc id="desc">以分层泳道和中央交换核心展示启动底座、VirtIO-net、TCP/IP、GIPC 协议、恢复机制和指标采集之间的关系。</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.subtitle{font:400 15px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}.lane{font:700 17px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.label{font:700 14px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.body{font:400 13px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:400 12px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}.mono{font:400 12px "DejaVu Sans Mono",monospace;fill:#334155}.lane-bg{fill:#fff;stroke:#cbd5e1;stroke-width:1.3;rx:12}.foundation{fill:#e0f2fe;stroke:#0284c7;stroke-width:1.8;rx:8}.starry{fill:#ecfdf5;stroke:#0f766e;stroke-width:1.8;rx:8}.arceos{fill:#fff7ed;stroke:#ea580c;stroke-width:1.8;rx:8}.core{fill:#dbeafe;stroke:#2563eb;stroke-width:2.4}.protocol{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.8;rx:8}.metric{fill:#fefce8;stroke:#ca8a04;stroke-width:1.8;rx:8}.blue{fill:none;stroke:#2563eb;stroke-width:2.8;marker-end:url(#blue-arrow)}.teal{fill:none;stroke:#0f766e;stroke-width:2.8;marker-end:url(#teal-arrow)}.orange{fill:none;stroke:#ea580c;stroke-width:2.5;marker-end:url(#orange-arrow)}.dashed{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:7 5}
    </style>
  </defs>
  <rect class="bg" width="1440" height="920"/>
  <text class="title" x="720" y="42" text-anchor="middle">GIPC 客户机通信链路：从设备帧到应用响应</text>
  <text class="subtitle" x="720" y="68" text-anchor="middle">任务二八项变更的分层关系、数据方向与验收观测点</text>

  <!-- layer 1: boot and virtualization -->
  <rect class="lane-bg" x="55" y="100" width="1330" height="115"/>
  <text class="lane" x="82" y="132">L0 · 启动与虚拟化前置</text>
  <rect class="foundation" x="300" y="118" width="245" height="76"/>
  <text class="label" x="422" y="145" text-anchor="middle">PR #1926 · FDT/PSCI</text>
  <text class="small" x="422" y="167" text-anchor="middle">guest 启动、vCPU/定时器基础</text>
  <rect class="foundation" x="575" y="118" width="245" height="76"/>
  <text class="label" x="697" y="145" text-anchor="middle">PR #1935 · VirtIO-MMIO</text>
  <text class="small" x="697" y="167" text-anchor="middle">镜像、设备发现、MMIO 接入</text>
  <rect class="foundation" x="850" y="118" width="245" height="76"/>
  <text class="label" x="972" y="145" text-anchor="middle">PR #1927 · dual VirtIO-net</text>
  <text class="small" x="972" y="167" text-anchor="middle">MAC、队列、内部 L2 switch</text>

  <!-- layer 2: endpoint bring-up -->
  <rect class="lane-bg" x="55" y="235" width="1330" height="155"/>
  <text class="lane" x="82" y="267">L1 · 客户机端点与地址配置</text>
  <rect class="starry" x="170" y="285" width="370" height="80"/>
  <text class="label" x="355" y="310" text-anchor="middle">StarryOS 智能侧端点</text>
  <text class="mono" x="355" y="331" text-anchor="middle">eth0 · 52:54:00:42:00:01</text>
  <text class="mono" x="355" y="349" text-anchor="middle">10.0.42.1/24 · network-init.sh</text>
  <rect class="arceos" x="900" y="285" width="370" height="80"/>
  <text class="label" x="1085" y="310" text-anchor="middle">ArceOS 控制侧端点</text>
  <text class="mono" x="1085" y="331" text-anchor="middle">eth0 · 52:54:00:42:00:02</text>
  <text class="mono" x="1085" y="349" text-anchor="middle">10.0.42.2/24 · ax_net::set_interface_ipv4</text>
  <path class="blue" d="M540 325 L900 325"/>
  <text class="small" x="720" y="315" text-anchor="middle">Ethernet / IPv4 私有子网</text>

  <!-- layer 3: central switching core -->
  <rect class="lane-bg" x="55" y="410" width="1330" height="185"/>
  <text class="lane" x="82" y="442">L2 · Axvisor 数据平面与传输核心</text>
  <polygon class="core" points="720,450 850,505 720,560 590,505"/>
  <text class="label" x="720" y="498" text-anchor="middle">Axvisor</text>
  <text class="label" x="720" y="518" text-anchor="middle">进程内 L2 switch</text>
  <text class="small" x="720" y="538" text-anchor="middle">virtio-net backend / port wakeup</text>
  <rect class="protocol" x="115" y="470" width="315" height="80"/>
  <text class="label" x="272" y="495" text-anchor="middle">PR #2155 · IP 传输</text>
  <text class="small" x="272" y="516" text-anchor="middle">VirtIO-net MMIO → switch → VirtIO-net MMIO</text>
  <text class="small" x="272" y="535" text-anchor="middle">无宿主 bridge / NAT / vsock 业务通道</text>
  <rect class="protocol" x="1010" y="470" width="315" height="80"/>
  <text class="label" x="1167" y="495" text-anchor="middle">TCP/IP 会话</text>
  <text class="small" x="1167" y="516" text-anchor="middle">Starry connect → ArceOS listen</text>
  <text class="small" x="1167" y="535" text-anchor="middle">业务端口 4242 · 读写 deadline 1 s</text>
  <path class="teal" d="M430 510 L585 510"/><path class="teal" d="M855 510 L1010 510"/>

  <!-- layer 4: framing and recovery -->
  <rect class="lane-bg" x="55" y="615" width="1330" height="145"/>
  <text class="lane" x="82" y="647">L3 · GIPC 应用层 framing 与可靠性</text>
  <rect class="protocol" x="135" y="670" width="510" height="66"/>
  <text class="label" x="390" y="695" text-anchor="middle">PR #2156 · 固定头协议</text>
  <text class="mono" x="390" y="718" text-anchor="middle">magic | ver | type | len | seq | timestamp | error | CRC32</text>
  <rect class="protocol" x="795" y="670" width="510" height="66"/>
  <text class="label" x="1050" y="695" text-anchor="middle">PR #2157 · TCP 恢复状态机</text>
  <text class="small" x="1050" y="718" text-anchor="middle">分帧 · seq++ · duplicate/out-of-order · retry ×3 · reconnect</text>

  <!-- layer 5: application direction -->
  <rect class="lane-bg" x="55" y="780" width="1330" height="105"/>
  <text class="lane" x="82" y="812">L4 · 业务请求、状态回传与验收观测</text>
  <rect class="starry" x="180" y="827" width="265" height="40"/>
  <text class="small" x="312" y="852" text-anchor="middle">CONTROL / HEARTBEAT · seq++</text>
  <path class="blue" d="M445 847 L995 847"/>
  <text class="small" x="720" y="837" text-anchor="middle">TCP 4242：请求方向</text>
  <rect class="arceos" x="995" y="827" width="265" height="40"/>
  <text class="small" x="1127" y="852" text-anchor="middle">STATUS / ERROR · error_code</text>
  <path class="orange" d="M995 875 L445 875"/>
  <text class="small" x="720" y="899" text-anchor="middle">反向响应：匹配 sequence、状态、时间戳；PR #2158/#2159 采集 metrics</text>

  <!-- callouts -->
  <path class="dashed" d="M110 760 L110 902"/>
  <text class="small" x="120" y="900">验收：GIPC_STARRY_NET_READY → GIPC_RTOS_READY → STATUS → METRIC</text>
</svg>
