<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">StarryOS 与 ArceOS 客户机 IP 通信架构</title>
  <desc id="desc">Axvisor 通过两个 VirtIO-net 端点和进程内二层交换机连接 StarryOS 智能侧与 ArceOS 控制侧，TCP 4242 承载 GIPC 应用层协议，支持控制、状态、错误、重连和指标采集。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.subtitle{font:400 15px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 19px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.label{font:700 15px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.body{font:400 13px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:400 12px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}.mono{font:400 12px "DejaVu Sans Mono",monospace;fill:#334155}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:9}.starry{fill:#ecfdf5;stroke:#0f766e;stroke-width:2;rx:10}.arceos{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:10}.visor{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:10}.switch{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:12}.metric{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.5;rx:8}.blue{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrow-blue)}.green{fill:none;stroke:#0f766e;stroke-width:3;marker-end:url(#arrow-green)}.orange{fill:none;stroke:#ea580c;stroke-width:2.5;marker-end:url(#arrow-orange)}.dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:7 5}
    </style>
  </defs>
  <rect class="bg" width="1440" height="980"/>
  <text class="title" x="720" y="42" text-anchor="middle">StarryOS ↔ ArceOS 客户机 IP 通信架构</text>
  <text class="subtitle" x="720" y="68" text-anchor="middle">任务二通信底座：VirtIO-net / Axvisor L2 switch / IPv4 / TCP 4242 / GIPC 应用协议 / 可观测性</text>

  <rect class="starry" x="55" y="115" width="410" height="360"/>
  <text class="h" x="260" y="148" text-anchor="middle">StarryOS/Linux 智能侧客户机</text>
  <text class="mono" x="78" y="177">MAC 52:54:00:42:00:01</text>
  <text class="mono" x="78" y="198">eth0 10.0.42.1/24</text>
  <rect class="card" x="82" y="225" width="165" height="74"/>
  <text class="label" x="164" y="252" text-anchor="middle">网络启动</text>
  <text class="small" x="164" y="273" text-anchor="middle">gipc-network-init.sh</text>
  <text class="small" x="164" y="289" text-anchor="middle">link up / addr / route</text>
  <rect class="card" x="273" y="225" width="165" height="74"/>
  <text class="label" x="355" y="252" text-anchor="middle">IP/TCP 协议栈</text>
  <text class="small" x="355" y="273" text-anchor="middle">connect :4242</text>
  <text class="small" x="355" y="289" text-anchor="middle">1 s I/O deadline</text>
  <rect class="card" x="82" y="325" width="165" height="90"/>
  <text class="label" x="164" y="352" text-anchor="middle">GIPC 客户端</text>
  <text class="small" x="164" y="373" text-anchor="middle">CONTROL / HEARTBEAT</text>
  <text class="small" x="164" y="390" text-anchor="middle">seq++ / retry ×3</text>
  <text class="small" x="164" y="407" text-anchor="middle">ERROR / metrics</text>
  <rect class="card" x="273" y="325" width="165" height="90"/>
  <text class="label" x="355" y="352" text-anchor="middle">验证与指标</text>
  <text class="small" x="355" y="373" text-anchor="middle">STATUS / CRC / seq</text>
  <text class="small" x="355" y="390" text-anchor="middle">RTT / throughput</text>
  <text class="small" x="355" y="407" text-anchor="middle">success / timeout / recovery</text>
  <text class="body" x="260" y="450" text-anchor="middle">PR #2159 补齐启动入口与可观测性</text>

  <rect class="arceos" x="975" y="115" width="410" height="360"/>
  <text class="h" x="1180" y="148" text-anchor="middle">ArceOS/RTOS 控制侧客户机</text>
  <text class="mono" x="998" y="177">MAC 52:54:00:42:00:02</text>
  <text class="mono" x="998" y="198">eth0 10.0.42.2/24</text>
  <rect class="card" x="1002" y="225" width="165" height="74"/>
  <text class="label" x="1084" y="252" text-anchor="middle">ax-net 配置</text>
  <text class="small" x="1084" y="273" text-anchor="middle">set_interface_ipv4</text>
  <text class="small" x="1084" y="289" text-anchor="middle">10.0.42.2 / 24</text>
  <rect class="card" x="1193" y="225" width="165" height="74"/>
  <text class="label" x="1275" y="252" text-anchor="middle">TCP 服务端</text>
  <text class="small" x="1275" y="273" text-anchor="middle">listen 0.0.0.0:4242</text>
  <text class="small" x="1275" y="289" text-anchor="middle">accept / recover</text>
  <rect class="card" x="1002" y="325" width="165" height="90"/>
  <text class="label" x="1084" y="352" text-anchor="middle">帧解码与会话</text>
  <text class="small" x="1084" y="373" text-anchor="middle">magic/version/length</text>
  <text class="small" x="1084" y="390" text-anchor="middle">CRC / sequence window</text>
  <text class="small" x="1084" y="407" text-anchor="middle">duplicate / out-of-order</text>
  <rect class="card" x="1193" y="325" width="165" height="90"/>
  <text class="label" x="1275" y="352" text-anchor="middle">控制状态</text>
  <text class="small" x="1275" y="373" text-anchor="middle">CONTROL → STATUS</text>
  <text class="small" x="1275" y="390" text-anchor="middle">ERROR(error_code)</text>
  <text class="small" x="1275" y="407" text-anchor="middle">状态/异常回传</text>
  <text class="body" x="1180" y="450" text-anchor="middle">PR #2156/#2157 提供服务端协议与恢复</text>

  <rect class="switch" x="530" y="150" width="380" height="205"/>
  <text class="h" x="720" y="184" text-anchor="middle">Axvisor 进程内二层交换机</text>
  <text class="body" x="720" y="211" text-anchor="middle">两个独立 VirtIO-net MMIO 端点</text>
  <rect class="card" x="565" y="235" width="130" height="65"/>
  <text class="label" x="630" y="261" text-anchor="middle">virtnet0</text>
  <text class="small" x="630" y="282" text-anchor="middle">Starry port</text>
  <rect class="card" x="745" y="235" width="130" height="65"/>
  <text class="label" x="810" y="261" text-anchor="middle">virtnet0</text>
  <text class="small" x="810" y="282" text-anchor="middle">ArceOS port</text>
  <text class="small" x="720" y="330" text-anchor="middle">仅交换二层 IP/Ethernet 帧；无宿主 bridge/NAT</text>
  <path class="blue" d="M465 260 C500 260 510 260 530 260"/>
  <path class="blue" d="M910 260 C930 260 945 260 975 260"/>

  <rect class="visor" x="115" y="525" width="1210" height="110"/>
  <text class="h" x="720" y="559" text-anchor="middle">任务一通信前置底座</text>
  <text class="body" x="720" y="587" text-anchor="middle">PR #1926：PSCI/FDT 启动基础　·　PR #1927：双 guest VirtIO-net　·　PR #1935：VirtIO-MMIO 设备核心</text>
  <text class="small" x="720" y="612" text-anchor="middle">VM 生命周期 / vCPU 与地址空间隔离 / MMIO 设备发现 / IRQ 注入 / 客户机镜像加载</text>
  <path class="dash" d="M260 475 L260 525"/><path class="dash" d="M1180 475 L1180 525"/><path class="dash" d="M720 355 L720 525"/>

  <rect class="metric" x="120" y="685" width="1200" height="105"/>
  <text class="h" x="720" y="718" text-anchor="middle">协议帧与验证闭环（PR #2156 / #2157 / #2158 / #2159）</text>
  <text class="mono" x="720" y="747" text-anchor="middle">magic | version | msg_type | flags | header_len | payload_len | sequence | timestamp_ns | error_code | CRC32</text>
  <text class="small" x="720" y="772" text-anchor="middle">32-byte fixed header + payload ≤ 1200 B　·　TCP response confirms delivery　·　失败以非零状态和 GIPC_* 日志传播</text>

  <path class="green" d="M438 370 C555 405 830 405 1002 370"/>
  <text class="small" x="720" y="402" text-anchor="middle">TCP CONTROL / HEARTBEAT → STATUS / ERROR（端口 4242）</text>
  <path class="orange" d="M1002 420 C830 475 555 475 438 420"/>
  <text class="small" x="720" y="492" text-anchor="middle">反向状态：sequence、error_code、timestamp、执行结果</text>

  <rect class="card" x="160" y="835" width="1120" height="88"/>
  <text class="h" x="720" y="863" text-anchor="middle">验收指标</text>
  <text class="body" x="720" y="889" text-anchor="middle">success rate · application errors · timeouts · attempts/reconnects · recovery · RTT P50/P95 · effective throughput</text>
  <text class="small" x="720" y="910" text-anchor="middle">运行入口：os/axvisor/scripts/run-qemu-aarch64-starry-rtos-gipc.sh　|　日志校验：verify_metrics.py / aggregate_metrics.py</text>
</svg>
