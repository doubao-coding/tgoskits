<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">任务二客户机通信测试证据金字塔</title><desc id="desc">从静态质量、协议单元测试、确定性故障注入到双客户机端到端与指标归档的分层测试证据。</desc><defs><style>.bg{fill:#f8fafc}.t{font:700 28px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font:700 16px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.b{font:400 12px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}.s{font:400 11px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}.l1{fill:#e0f2fe;stroke:#0284c7;stroke-width:1.8}.l2{fill:#dbeafe;stroke:#2563eb;stroke-width:1.8}.l3{fill:#ede9fe;stroke:#7c3aed;stroke-width:1.8}.l4{fill:#dcfce7;stroke:#16a34a;stroke-width:1.8}.l5{fill:#ffedd5;stroke:#ea580c;stroke-width:1.8}.note{fill:#fff;stroke:#cbd5e1;stroke-width:1.3;rx:8}.line{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 4}</style></defs><rect class="bg" width="1400" height="760"/><text class="t" x="700" y="44" text-anchor="middle">任务二测试证据金字塔与交付门禁</text><text class="s" x="700" y="69" text-anchor="middle">越向上越接近真实系统行为；越向下越适合快速、确定性回归</text>
<polygon class="l5" points="700,105 830,210 570,210"/><text class="h" x="700" y="155" text-anchor="middle">双 guest E2E</text><text class="s" x="700" y="178" text-anchor="middle">Axvisor / VirtIO / TCP / GIPC</text>
<polygon class="l4" points="570,225 830,225 980,335 420,335"/><text class="h" x="700" y="268" text-anchor="middle">端到端日志与指标验收</text><text class="s" x="700" y="291" text-anchor="middle">NET_READY · LISTEN · STATUS · METRIC · AGGREGATE</text><text class="s" x="700" y="313" text-anchor="middle">成功率 / 错误 / 超时 / 恢复 / RTT P50/P95 / 有效吞吐</text>
<polygon class="l3" points="420,350 980,350 1120,465 280,465"/><text class="h" x="700" y="392" text-anchor="middle">确定性故障注入与恢复</text><text class="s" x="700" y="416" text-anchor="middle">首次连接关闭 → 第二次连接成功 · attempts=2 · timeouts=1 · reconnects=1 · recovery=1</text><text class="s" x="700" y="440" text-anchor="middle">协议坏帧 / ERROR / duplicate / out-of-order 按覆盖状态分别归档</text>
<polygon class="l2" points="280,480 1120,480 1240,590 160,590"/><text class="h" x="700" y="520" text-anchor="middle">协议与状态机单元测试</text><text class="s" x="700" y="545" text-anchor="middle">encode/decode round-trip · CRC 损坏 · trailing bytes · retry budget · duplicate/out-of-order</text><text class="s" x="700" y="568" text-anchor="middle">不启动 socket、VirtIO-net 或 guest，负责精确验证纯协议不变量</text>
<polygon class="l1" points="160,605 1240,605 1340,700 60,700"/><text class="h" x="700" y="642" text-anchor="middle">构建、Clippy、C/Python 静态质量与配置检查</text><text class="s" x="700" y="666" text-anchor="middle">cargo fmt / test / clippy / check · cc -Wall -Wextra -Werror · py_compile · git diff --check</text><text class="s" x="700" y="687" text-anchor="middle">最短反馈环，阻止格式、编译、类型和脚本语法问题进入上层运行测试</text>
<line class="line" x1="1100" y1="160" x2="1290" y2="160"/><rect class="note" x="1110" y="95" width="250" height="110"/><text class="h" x="1235" y="124" text-anchor="middle">交付原则</text><text class="s" x="1235" y="149" text-anchor="middle">下层通过不能替代上层</text><text class="s" x="1235" y="170" text-anchor="middle">E2E 数值必须来自归档日志</text><text class="s" x="1235" y="190" text-anchor="middle">失败以非零状态传播</text></svg>
