<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">8ms 实时控制循环流程图</title>
  <desc id="desc">展示 Axvisor 预留实时 CPU 上双轮足控制任务的 8ms 周期流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .sub{font:400 14px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.4;rx:8}
      .hot{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:8}
      .safe{fill:#ecfdf5;stroke:#0f766e;stroke-width:2;rx:8}
      .label{font:700 15px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .body{font:400 12px Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}
      .line{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1440" height="780"/>
  <text class="title" x="720" y="45" text-anchor="middle">Axvisor RT 侧 8ms 双轮足控制循环</text>
  <text class="sub" x="720" y="73" text-anchor="middle">语音识别不参与 8ms 硬实时路径；实时任务只消费最新有限命令并持续保持平衡控制</text>

  <rect class="safe" x="80" y="145" width="190" height="82"/>
  <text class="label" x="175" y="178" text-anchor="middle">周期开始</text>
  <text class="body" x="175" y="203" text-anchor="middle">deadline = now + 8ms</text>
  <rect class="box" x="330" y="145" width="210" height="82"/>
  <text class="label" x="435" y="178" text-anchor="middle">读取 RT mailbox</text>
  <text class="body" x="435" y="203" text-anchor="middle">token -> BalanceTarget</text>
  <rect class="box" x="600" y="145" width="210" height="82"/>
  <text class="label" x="705" y="178" text-anchor="middle">命令 watchdog</text>
  <text class="body" x="705" y="203" text-anchor="middle">超时则 fallback stop</text>
  <rect class="box" x="870" y="145" width="210" height="82"/>
  <text class="label" x="975" y="178" text-anchor="middle">读取 IMU/电机</text>
  <text class="body" x="975" y="203" text-anchor="middle">I2C5 + UART feedback</text>
  <rect class="box" x="1140" y="145" width="210" height="82"/>
  <text class="label" x="1245" y="178" text-anchor="middle">EKF 状态估计</text>
  <text class="body" x="1245" y="203" text-anchor="middle">theta / velocity / yaw</text>

  <rect class="box" x="1140" y="330" width="210" height="82"/>
  <text class="label" x="1245" y="363" text-anchor="middle">动力学模型</text>
  <text class="body" x="1245" y="388" text-anchor="middle">腿高、质心、惯量</text>
  <rect class="hot" x="870" y="330" width="210" height="82"/>
  <text class="label" x="975" y="363" text-anchor="middle">LQR 扭矩控制</text>
  <text class="body" x="975" y="388" text-anchor="middle">增益插值 + torque</text>
  <rect class="box" x="600" y="330" width="210" height="82"/>
  <text class="label" x="705" y="363" text-anchor="middle">限幅与保护</text>
  <text class="body" x="705" y="388" text-anchor="middle">速度 / yaw / torque</text>
  <rect class="box" x="330" y="330" width="210" height="82"/>
  <text class="label" x="435" y="363" text-anchor="middle">输出电机帧</text>
  <text class="body" x="435" y="388" text-anchor="middle">Lingkong 0xA1 / UART</text>
  <rect class="box" x="80" y="330" width="190" height="82"/>
  <text class="label" x="175" y="363" text-anchor="middle">设置舵机</text>
  <text class="body" x="175" y="388" text-anchor="middle">UART7 腿部高度</text>

  <rect class="safe" x="440" y="530" width="260" height="88"/>
  <text class="label" x="570" y="562" text-anchor="middle">记录周期指标</text>
  <text class="body" x="570" y="587" text-anchor="middle">IMU / control / UART / miss</text>
  <rect class="hot" x="760" y="530" width="260" height="88"/>
  <text class="label" x="890" y="562" text-anchor="middle">deadline 检查</text>
  <text class="body" x="890" y="587" text-anchor="middle">超时记录并重新对齐</text>

  <path class="line" d="M270 186 L330 186"/>
  <path class="line" d="M540 186 L600 186"/>
  <path class="line" d="M810 186 L870 186"/>
  <path class="line" d="M1080 186 L1140 186"/>
  <path class="line" d="M1245 227 L1245 330"/>
  <path class="line" d="M1140 371 L1080 371"/>
  <path class="line" d="M870 371 L810 371"/>
  <path class="line" d="M600 371 L540 371"/>
  <path class="line" d="M330 371 L270 371"/>
  <path class="line" d="M175 412 C175 575, 330 575, 440 575"/>
  <path class="line" d="M700 575 L760 575"/>
  <path class="dash" d="M890 530 C925 485, 925 465, 890 430"/>
  <path class="dash" d="M890 618 C890 705, 175 705, 175 227"/>
</svg>
