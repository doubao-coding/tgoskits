args = [
  "-nographic",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-device",
  "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=65",
  "-drive",
  "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
  "-device",
  "virtio-blk-device,drive=guestdisk",
  "-drive",
  "id=guestdisk,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-sensevoice.img/rootfs-aarch64-sensevoice.img",
  "-m",
  "8g",
]
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "(?i)unhandled page fault",
  "Failed to initialize guest VM",
  "failed to initialize AxVM manager",
  "(?m)^SENSEVOICE_TEST_FAILED:",
  "(?i)segmentation fault",
  "(?i)illegal instruction",
  "(?i)bus error",
  "(?i)out of memory",
  # See qemu-starry/smoke: a guest spinning in EL2 exception loops must fail
  # fast instead of burning the full timeout.
  "ESR_EL2",
  "(?m)^memory allocation of \\d+ bytes failed$",
]
# Concurrent console streams may prepend ANSI SGR resets to a completion line.
success_regex = [
  "(?m)^(?:\\x1b\\[[0-9;]*m)*(?:\\[VM 1\\] )?SENSEVOICE_TEST_PASSED\\s*$",
]
# disk0 (Axvisor rootfs with the guest kernel image) is patched to the managed
# Alpine image; guestdisk points at the sensevoice asset image and is preserved
# because its path differs from disk0.
shell_prefix = "root@starry:/root #"
shell_init_cmd = "/usr/bin/sensevoice-test.sh"
# Hypervisor layer adds boot overhead on top of the already minutes-long TCG
# inference of the sensevoice app.
timeout = 1800
to_bin = true
uefi = false
